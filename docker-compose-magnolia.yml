---
name: rudiplatform

services:
  magnolia-database:
    image: postgres:15.8
    restart: unless-stopped
    environment:
      - "LC_ALL=C.UTF-8"
      - "POSTGRES_DB=magnolia"
      - "POSTGRES_USER=magnolia"
      - "POSTGRES_PASSWORD=${DB_MAGNOLIA}"
      - "POSTGRES_PORT=5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - ./database-data/magnolia:/var/lib/postgresql/data
    profiles:
      - magnolia

  magnolia:
    build: ./image/magnolia
    image: rudiplatform/magnolia
    security_opt:
      - seccomp=unconfined
    depends_on:
      - magnolia-database
    volumes:
      - ./config/magnolia:/usr/local/tomcat/webapps/ROOT/WEB-INF/config
      # Fresh deploy: empty directory, Magnolia initializes from scratch
      - ./data/magnolia/repository:/opt/magnolia/data/repository
      # To restore demo content (JCR datastore), swap the line above with:
      # - ./dummy-data/magnolia/repository:/opt/magnolia/data/repository
    environment:
      - "MAGNOLIA_BDD_HOST=magnolia-database"
      - "MAGNOLIA_BDD_USER=magnolia"
      - "MAGNOLIA_BDD_PASSWORD=${DB_MAGNOLIA}"
      - "MAGNOLIA_REPOSITORY_ROOT=/opt/magnolia/data"
      - "CATALINA_OPTS=-DMAGNOLIA_REPOSITORY_ROOT=\"/opt/magnolia/data\"  -DMAGNOLIA_BDD_HOST=magnolia-database -DMAGNOLIA_BDD_USER=magnolia -DMAGNOLIA_BDD_PASSWORD=${DB_MAGNOLIA} -Xmx2048m -Dmagnolia.update.auto=true"
    profiles:
      - magnolia
