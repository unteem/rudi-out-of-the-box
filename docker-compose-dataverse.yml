---
name: rudiplatform

services:
  dataverse-database:
    image: postgres:15.12-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      - "LC_ALL=C.UTF-8"
      - "POSTGRES_DB=dataverse"
      - "POSTGRES_USER=dataverse"
      - "POSTGRES_PASSWORD=${DB_DATAVERSE}"
      - "POSTGRES_PORT=5432"
    volumes:
      - ./database-data/dataverse:/var/lib/postgresql/data

  solr:
    image: solr:9.8.0
    restart: unless-stopped
    environment:
      - "SOLR_JAVA_MEM=-Xms1g -Xmx1g"
      - "SOLR_OPTS=-Dlog4j2.formatMsgNoLookups=true -Dsolr.jetty.request.header.size=65535"
    command:
      - "solr-precreate"
      - "collection1"
      - "/template"
    volumes:
      - ./data/solr/solr-data:/var/solr
      # Schéma Solr Dataverse + champs RUDI, copié dans le core à la première création
      - ./config/solr/collection1:/template:ro
    profiles:
      - dataverse

  dataverse:
    image: gdcc/dataverse:${dataverse_version}
    restart: unless-stopped
    profiles:
      - dataverse
    environment:
      - "DATAVERSE_DB_HOST=dataverse-database"
      - "DATAVERSE_DB_PORT=5432"
      - "DATAVERSE_DB_USER=dataverse"
      - "DATAVERSE_DB_PASSWORD=${DB_DATAVERSE}"
      - "DATAVERSE_DB_NAME=dataverse"
      - "SOLR_SERVICE_HOST=solr"
      - "SOLR_SERVICE_PORT=8983"
      - "dataverse_solr_host=solr"
      - "dataverse_solr_port=8983"
      - "dataverse_pid_providers=fake"
      - "dataverse_pid_fake_type=FAKE"
      - "dataverse_pid_fake_label=Fake DOI Provider"
      - "dataverse_pid_fake_authority=10.5072"
      - "dataverse_pid_fake_shoulder=FK2/"
      - "dataverse_pid_default__provider=fake"
      # URL publique (liens des mails et des exports Dataverse)
      - "dataverse_siteUrl=https://${DATAVERSE_DOMAIN:-dataverse.${base_dn}}"
      - "dataverse_files_storage__driver__id=file"
      - "dataverse_files_file_type=file"
      - "dataverse_files_file_directory=/data"
      # API admin et builtin-users accessibles uniquement depuis le conteneur (localhost)
      - "dataverse_api_blocked_endpoints=admin,builtin-users"
      - "dataverse_api_blocked_policy=localhost-only"
    depends_on:
      - dataverse-database
      - solr
    volumes:
      - ./data/dataverse/secrets:/secrets
      - ./data/dataverse/dataverse-files:/data

