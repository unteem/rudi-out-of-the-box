# Traefik v3 Configuration with Let's Encrypt Auto-Generated Certificates

# Global Configuration
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: false  # pas de dashboard exposé sans route authentifiée

# Logging
log:
  level: INFO  # DEBUG, INFO, WARN, ERROR
  filePath: "/var/log/traefik/traefik.log"
  format: json

# Access Logs
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100

# Metrics (optional - enable if you want Prometheus metrics)
# metrics:
#   prometheus:
#     addEntryPointsLabels: true
#     addServicesLabels: true

# Providers
providers:
  # Docker Provider
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: traefik
    
  # File Provider (optional - for static configurations)
  # file:
  #   directory: "/etc/traefik/dynamic"
  #   watch: true

# Entry Points
entryPoints:
  # HTTP entry point (port 80)
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  
  # HTTPS entry point (port 443)
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
    # Optional: HTTP/3 support (experimental)
    # http3:
    #   advertisedPort: 443

# Certificate Resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      # Email for Let's Encrypt notifications
      # IMPORTANT: Replace with your actual email
      email: "admin@indiehosters.net"
      
      # Storage location for certificates
      storage: "/acme.json"
      
      # Key type (EC384 is recommended for better performance and security)
      keyType: EC384
      
      # Let's Encrypt server
      # Production (default):
      # caServer: "https://acme-v02.api.letsencrypt.org/directory"
      
      # Staging (for testing - uncomment to avoid rate limits):
      # caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      
      # HTTP-01 Challenge
      httpChallenge:
        entryPoint: web
      
      # Alternative: TLS-ALPN-01 Challenge (if you can't use port 80)
      # tlsChallenge: {}
      
      # Alternative: DNS-01 Challenge (for wildcard certificates)
      # dnsChallenge:
      #   provider: cloudflare
      #   delayBeforeCheck: 0
      #   resolvers:
      #     - "1.1.1.1:53"
      #     - "8.8.8.8:53"

# TLS Options
tls:
  options:
    default:
      minVersion: VersionTLS12
      maxVersion: VersionTLS13
      sniStrict: true
      cipherSuites:
        # TLS 1.2 cipher suites
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        # TLS 1.3 cipher suites (automatically used when available)
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP521
        - CurveP384
    
    # Strict TLS 1.3 only (optional - for maximum security)
    # modern:
    #   minVersion: VersionTLS13
    #   maxVersion: VersionTLS13

# Server Transports (for backend connections)
serversTransport:
  # Skip verification for self-signed backend certificates
  insecureSkipVerify: true
  
  # Optional: Timeouts
  # forwardingTimeouts:
  #   dialTimeout: 30s
  #   responseHeaderTimeout: 0s
  #   idleConnTimeout: 90s

# Pilot (Traefik Hub - optional)
# pilot:
#   token: "your-pilot-token"

# Experimental Features
experimental:
  # HTTP/3 support (optional)
  # http3: true
  
  # Local plugins
  # localPlugins:
  #   example:
  #     moduleName: github.com/traefik/plugindemo
